name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    defaults:
      run:
        working-directory: python      # the Python package lives here (monorepo)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0             # hatch-vcs derives the version from tags
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # Install the engine extra (numpy/pyayay) so the engine tests run; if
          # it fails on a runner, fall back to the dependency-free core -- the
          # engine tests then self-skip (they guard on `import numpy`/`pyayay`).
          python -m pip install -e .[engine] || python -m pip install -e .
      - name: Test
        run: python -m pytest -q

  c:
    # The C reference: structural round trip, the timer engine's own checks,
    # and the cross-language diff of its write timeline against the Python
    # oracle. The Makefile drives the Python CLI for the fixtures, so this job
    # needs the package importable but none of the engine's audio deps.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the Python package
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Test
        working-directory: c
        run: make test CFLAGS="-std=c99 -Wall -Wextra -pedantic -Werror -Iinclude"
